<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Chomato Adapter Probe</title>
</head>
<body>
  <script type="module">
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) {
      console.log("[adapter] NULL");
    } else {
      const info = adapter.info ?? {};
      console.log("[adapter]", JSON.stringify({
        vendor: info.vendor,
        device: info.device,
        description: info.description,
        architecture: info.architecture,
        fallback: info.isFallbackAdapter ?? "?",
        maxBufferSize: Number(adapter.limits.maxBufferSize),
        maxStorageBufferBindingSize: Number(adapter.limits.maxStorageBufferBindingSize),
        maxComputeWorkgroupsPerDimension: adapter.limits.maxComputeWorkgroupsPerDimension,
      }));
    }
  </script>
</body>
</html>

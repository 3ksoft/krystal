<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chomato engine bridge smoke</title>
  <style>
    body { font: 14px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; max-width: 1000px; margin: 40px auto; padding: 0 20px; background: #111; color: #ddd; }
    .row { display: flex; gap: 12px; align-items: center; margin: 16px 0; }
    button, input { font: inherit; }
    #status { font-weight: 700; }
    #status.ok { color: #77dd77; }
    #status.error { color: #ff6961; }
    pre { white-space: pre-wrap; background: #181818; padding: 16px; border-radius: 8px; min-height: 180px; }
  </style>
</head>
<body>
  <h1>engine-ts ↔ WebGPU bridge smoke</h1>
  <p>Creates a token block, an exact recomputable checkpoint, two branches, and compares bridge generation with direct Lfm2Forward.</p>
  <div class="row">
    <input id="model" type="file" accept=".wq4" />
    <button id="run">Run bridge smoke</button>
    <span id="status">IDLE</span>
  </div>
  <pre id="output"></pre>
  <script type="module" src="./engine-main.ts"></script>
</body>
</html>
